sentence=Zero-dependency WS2812B LED matrix display library for Arduino/ESP32.
paragraph=MatrixForge provides a full-featured drawing API (pixels, lines, rectangles, circles, text, sprites) for a 16×16 WS2812B LED matrix. No FastLED or Adafruit NeoPixel required — hardware-accelerated on ESP32 via the RMT peripheral, with bit-bang fallbacks for AVR and generic ARM.
