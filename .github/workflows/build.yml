# Compiles every Arduino/ESP32 sketch and checks every Python file
# on each push and pull request. Results: the "Actions" tab on GitHub.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:      # adds a "Run workflow" button on the Actions tab

jobs:
  arduino:
    name: Arduino (${{ matrix.family }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: uno
            core: arduino:avr@1.8.8
            index_url: ""
          - family: esp32
            core: esp32:esp32@3.3.11
            index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cache board packages
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-${{ matrix.core }}

      - name: Install board package ${{ matrix.core }}
        run: |
          if [ -n "${{ matrix.index_url }}" ]; then
            arduino-cli config init --overwrite
            arduino-cli config add board_manager.additional_urls "${{ matrix.index_url }}"
          fi
          arduino-cli core update-index
          arduino-cli core install "${{ matrix.core }}"

      - name: Compile sketches
        run: bash .github/scripts/compile_sketches.sh ${{ matrix.family }}

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install packages
        run: pip install -r python/requirements.txt

      - name: Check every .py file compiles
        run: python -m compileall -q python

      - name: Check ChirpQuest starts (without an API key)
        working-directory: python/04_ChirpQuest
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("chirpquest", "chirpquest.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          client = m.app.test_client()
          assert client.get("/").status_code == 200
          assert len(client.get("/api/birds").get_json()) == 16
          reply = client.post("/api/chat", json={"message": "hello"}).get_json()["reply"]
          print("home page OK, 16 birds OK, chat fallback reply:", reply)
          PY
